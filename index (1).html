<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salcombe Sea Salt – Devon's Finest</title>
<meta name="description" content="Salcombe Sea Salt – 100% sea salt from the Devon coast.">
<link rel="preload" as="image" href="salcombe-splash.jpg">
<style>
  :root { --navy: #14215a; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    overflow: hidden;
    background: #3fa2e6;
    font-family: Georgia, "Times New Roman", serif;
  }

  /* Blurred copy of the image fills any space around the main image */
  .backdrop {
    position: fixed; inset: -40px;
    background: url("salcombe-splash.jpg") center / cover no-repeat;
    filter: blur(28px) saturate(1.1);
  }

  /* Main image: always shown in full (logo never cropped), centred */
  .stage { position: fixed; inset: 0; overflow: hidden; }
  .frame {
    position: absolute; left: 50%; top: 50%;
    translate: -50% -50%;
    width: min(100vw, 100vh * 1672 / 941);
    width: min(100vw, 100dvh * 1672 / 941);
    aspect-ratio: 1672 / 941;
    animation: fade 1.2s ease-out both;
  }
  /* Laptops/desktops a bit narrower than 16:9: fill the screen, trimming only the sides */
  @media (max-aspect-ratio: 1672/941) and (min-aspect-ratio: 13/10) {
    .frame { width: calc(100vh * 1672 / 941); width: calc(100dvh * 1672 / 941); }
  }
  /* Phones & portrait tablets: enlarge the image (sides trimmed, logo kept whole)
     and fade its top/bottom edges into the background */
  @media (max-aspect-ratio: 13/10) {
    .frame { width: min(185vw, 100dvh * 1672 / 941); animation-name: fadeOnly; }
    .stage .frame img {
      box-shadow: none;
      -webkit-mask-image: linear-gradient(transparent, #000 9%, #000 91%, transparent);
              mask-image: linear-gradient(transparent, #000 9%, #000 91%, transparent);
    }
    .backdrop { filter: blur(40px) saturate(1.15); }
    .stage .enter { font-size: .8rem; padding: .75rem 1.6rem; letter-spacing: .14em; }
  }
  .frame img {
    display: block; width: 100%; height: 100%;
    box-shadow: 0 0 60px rgba(0, 30, 80, .25);
  }

  /* Button sits in the clear sky between the logo and the hills */
  .enter {
    position: absolute; left: 50%; top: 51%;
    transform: translate(-50%, -50%);
    padding: clamp(.55rem, 1.4vw, 1rem) clamp(1.6rem, 4vw, 3rem);
    font: 600 clamp(.8rem, 1.5vw, 1.15rem)/1 Georgia, serif;
    letter-spacing: .18em; text-transform: uppercase; white-space: nowrap;
    color: var(--navy);
    background: rgba(255, 255, 255, .85);
    border: 2px solid var(--navy);
    border-radius: 999px;
    backdrop-filter: blur(4px);
    box-shadow: 0 6px 24px rgba(0, 30, 80, .25);
    animation: rise 1s .8s ease-out both;
  }

  @keyframes fade { from { opacity: 0; transform: scale(1.02); } }
  /* Ultra-wide screens: soften the left/right edges into the backdrop */
  @media (min-aspect-ratio: 1.9) {
    .stage .frame img {
      box-shadow: none;
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
              mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);
    }
  }
  @keyframes fadeOnly { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, -20%); } }
  @media (prefers-reduced-motion: reduce) {
    .frame, .enter { animation: none; }
  }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="stage">
    <div class="frame">
      <img src="salcombe-splash.jpg" width="1672" height="941"
           alt="Salcombe Sea Salt – Devon's Finest. 100% sea salt. Sailing boats moored in Salcombe harbour on a sunny day.">
      <p class="enter">New website coming soon</p>
    </div>
  </main>
</body>
</html>
